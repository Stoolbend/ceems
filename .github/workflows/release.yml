name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run checks
        run: powershell -NoProfile -File scripts/test.ps1

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
            if [[ ! "$GITHUB_REF_NAME" =~ $re ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version like v1.2.3 or v1.2.3-rc.1"
              exit 1
            fi
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: pwsh -NoProfile -File scripts/build.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          mkdir "$stage/win" "$stage/arm64" "$stage/amd64" "$stage/armv6"

          cp dist/ceems-windows-amd64.exe "$stage/win/ceems.exe"
          cp ceems.example.json LICENSE web/public/THIRD_PARTY_NOTICES.txt "$stage/win/"
          (cd "$stage/win" && zip -q "$GITHUB_WORKSPACE/dist/ceems-$VERSION-windows-amd64.zip" ceems.exe ceems.example.json LICENSE THIRD_PARTY_NOTICES.txt)

          for arch in arm64 amd64 armv6; do
            d="$stage/$arch"
            cp "dist/ceems-linux-$arch" "$d/ceems"
            chmod 0755 "$d/ceems"
            cp ceems.example.json LICENSE web/public/THIRD_PARTY_NOTICES.txt "$d/"
            mkdir "$d/deploy"
            cp deploy/ceems.service deploy/ceems.json deploy/README.md "$d/deploy/"
            tar -C "$d" -czf "dist/ceems-$VERSION-linux-$arch.tar.gz" ceems ceems.example.json LICENSE THIRD_PARTY_NOTICES.txt deploy
            tar tzvf "dist/ceems-$VERSION-linux-$arch.tar.gz" | grep '^-rwx.* ceems$' >/dev/null
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ceems-${{ steps.version.outputs.version }}
          path: |
            dist/ceems-${{ steps.version.outputs.version }}-windows-amd64.zip
            dist/ceems-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
            dist/ceems-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/ceems-${{ steps.version.outputs.version }}-linux-armv6.tar.gz
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/ceems-$VERSION-windows-amd64.zip" \
            "dist/ceems-$VERSION-linux-arm64.tar.gz" \
            "dist/ceems-$VERSION-linux-amd64.tar.gz" \
            "dist/ceems-$VERSION-linux-armv6.tar.gz" \
            --verify-tag --generate-notes "${flags[@]}"
