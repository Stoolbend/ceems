; Sample vbit2 configuration for CeeMS tests.
; Each live line holds the value CeeMS writes by default.

; The header row: 32 cells, with a cyan control cell before the clock.
header_template=CeeMS   %%# %%a %e %%b C%H:%M:%S

; The page shown first.
initial_teletext_page=100

; Leave row adaptive mode off.
row_adaptive_mode=false

; VBI lines per field.
lines_per_field=16

; One priority value for each magazine, magazine 8 first, then 1 to 7.
magazine_priority=9,3,3,6,3,3,5,6

; The status text, up to 20 characters.
status_display=CeeMS

; The network identification code: four hex digits.
network_identification_code=0000

; The country and network identification: four hex digits.
country_network_identification=0000

; Lines per field kept for datacast packets, not more than lines_per_field.
datacast_lines=0

; Send the magazines one after another instead of interleaved.
magazine_serial=false
